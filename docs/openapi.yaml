openapi: 3.0.3
info:
  title: Lexiflow API
  description: |
    REST API for the LingQ Clone language-learning app: authentication, library/courses,
    lesson reader, vocabulary, phrases, uploads, and optional LingQ integration.

    **Authentication:** Most routes require a JWT in the `Authorization` header as
    `Bearer <token>`. Obtain a token from `POST /auth/login`; `POST /auth/register`
    creates the account but returns no token, so sign in afterwards. Tokens are
    valid for 7 days and every rejection — missing, expired, malformed or
    tampered — is a `401` carrying a `code` of `NO_TOKEN`, `TOKEN_EXPIRED` or
    `TOKEN_INVALID`.

    **Logout is client-side.** `POST /auth/logout` performs no server-side
    invalidation; the web client discards the token locally.

    **Error shapes:** `400`/`409` validation and conflict responses include an
    `errors` map keyed by field name, so a client can place each message beside
    its input. `429` responses carry `retryAfter` in seconds. `500` responses are
    always a generic message — the cause is logged server-side, never returned.

    **Rate limits:** login is throttled per `(email, ip)` and per IP;
    `POST /auth/check-availability` and `GET /auth/login-lockout` are throttled per
    IP. All are configurable through the environment.
  version: 1.1.0
  license:
    name: ISC
    identifier: ISC

servers:
  - url: http://localhost:3000/api/v1
    description: Local development (default port 3000)
  - url: https://lexiflow-backend-gsp5.onrender.com/api/v1
    description: Production (Render)

tags:
  - name: Health
    description: Service status
  - name: Auth
    description: Registration, login, profile, preferences, insights
  - name: Library
    description: |
      Courses, feeds, lesson discovery, and LingQ import.

      **Two ways to bring content in, with no overlap:**

      - *Manual import* — the user writes or pastes their own text. Create the
        destination course with `POST /library/courses`, then submit the text to
        `POST /lessons/parse`, which creates the lesson and tokenizes it.
      - *LingQ import* — the user supplies a LingQ API key and content is pulled
        from LingQ. Discover with `GET /library/lingq-courses` and
        `GET /library/lingq-lessons`, then import the chosen batch with
        `POST /library/lingq-import-selected`.
  - name: Lessons
    description: Lesson content, manual-import entry point, progress, editing
  - name: Vocabulary
    description: Word list, upsert, hints, analytics
  - name: Phrases
    description: User phrase LingQs
  - name: Upload
    description: Image and audio uploads for lessons

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from POST /auth/login (`token` field)

  parameters:
    TimezoneOffset:
      name: x-timezone-offset
      in: header
      required: false
      description: |
        Client's UTC offset in minutes (from `new Date().getTimezoneOffset()`).
        Used by the server to calculate the user's local midnight for daily stats and streak boundaries.
        Example: Jakarta (WIB, +07:00) sends `-420`.
      schema:
        type: integer
        example: -420

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    FieldErrors:
      type: object
      description: |
        Validation or conflict failure, reported per field so a client can place
        each message beside the input it belongs to. `error` always carries the
        first message for callers that only need a single string.
      required: [error]
      properties:
        error:
          type: string
          description: First failure message, for display in a generic banner.
        errors:
          type: object
          description: Field name to message.
          additionalProperties:
            type: string
      example:
        error: "Username must be 20 characters or fewer."
        errors:
          username: "Username must be 20 characters or fewer."
    RateLimited:
      type: object
      description: |
        Returned when a request exceeds a rate limit. `retryAfter` is the number
        of seconds until the request may be retried, so a client can resume a
        countdown after a reload.
      required: [error, code, retryAfter]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [LOCKED_OUT, RATE_LIMITED]
        retryAfter:
          type: integer
          description: Seconds to wait before retrying.
          example: 900
    AvailabilityResult:
      type: object
      description: |
        Which of the submitted identifiers are free. A field is omitted entirely
        when its value was absent or failed format validation — the endpoint
        declines to answer about a value that could not be registered anyway.
      properties:
        username:
          type: object
          properties:
            available:
              type: boolean
        email:
          type: object
          properties:
            available:
              type: boolean
      example:
        username: { available: false }
        email: { available: true }
    LockoutStatus:
      type: object
      description: Current brute-force lockout state for the calling client.
      required: [lockedOut, retryAfterMs, attemptsRemaining]
      properties:
        lockedOut:
          type: boolean
        retryAfterMs:
          type: integer
          description: Milliseconds of lockout remaining; 0 when not locked.
        attemptsRemaining:
          type: integer
          description: Failed logins left before this account locks.
          example: 3
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: v1
        message:
          type: string

    UserSession:
      type: object
      description: |
        Authenticated user profile fields returned from the database.
        Same shape from `POST /auth/login` and `GET /auth/verify`.
      required: [id, username, email]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        fullName:
          type: string
          description: Display name; may be an empty string if omitted at registration.
        preferences:
          type: object
          nullable: true
          properties:
            targetLanguage:
              type: string

    InsightStats:
      type: object
      properties:
        hasInsights:
          type: boolean
        discoveryVelocity:
          type: number
        matrix:
          type: object
          description: Markov transition matrix (6x6)
        stationary:
          type: object
          description: Stationary distribution and derived values
        metrics:
          type: object
          description: UX focused metrics derived from the matrix

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: |
        Creates the account and enrols it in one or more languages. Returns a
        success message only — **no token is issued**; sign in afterwards to
        authenticate.

        Outer whitespace on `username`, `fullName` and `email` is trimmed before
        validation and before storage. `password` is never trimmed.

        Validation failures come back as `400` with a per-field `errors` map, and
        duplicates as `409`, so a client can place each message beside its input.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password, targetLanguages]
              properties:
                email:
                  type: string
                  format: email
                  description: |
                    Dotted domain with an alphabetic TLD. Rejects `=`, `}`, `"`,
                    `|` and similar — permitted by RFC 5322 but issued by no mail
                    provider. Max 254 total, 64 in the local part.
                  example: ada@example.com
                username:
                  type: string
                  description: |
                    3-20 characters; ASCII letters, digits and underscore only;
                    must contain at least one letter. Compared case-insensitively
                    for uniqueness.
                  example: ada_learns
                fullName:
                  type: string
                  description: |
                    2-100 characters. Letters from any script (accents and
                    umlauts included), spaces, apostrophes and hyphens. Digits
                    and other symbols are rejected.
                  example: "O'Connor-Müller"
                password:
                  type: string
                  format: password
                  minLength: 6
                  maxLength: 128
                targetLanguages:
                  type: array
                  minItems: 1
                  maxItems: 10
                  description: |
                    Language codes, all of which must exist. The **first entry
                    becomes the user's primary language** and is stored in
                    `preferences.targetLanguage`; a `user_languages` and a
                    `streaks` row are written per language.
                  items:
                    type: string
                  example: [es, en]
                dailyGoalTier:
                  type: string
                  description: Daily goal tier id.
                  example: calm
      responses:
        '200':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Validation failed, or an unsupported language was requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
        '409':
          description: Username or email already taken (matched case-insensitively)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrors'
              example:
                error: "That username is already taken. Please choose another one."
                errors:
                  username: "That username is already taken. Please choose another one."

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: |
        Rate limited per `(email, ip)` and per IP. Once the threshold is reached
        the endpoint short-circuits with `429` **before** verifying the password,
        so a locked-out caller cannot use it as a CPU amplifier.

        Bad email and bad password return the same `401` with the same message,
        so the endpoint cannot be used to discover which addresses are registered.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: JWT and user payload (token valid for 7 days)
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserSession'
        '401':
          description: Invalid email or password — identical for both failure cases
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid email or password.
                  code:
                    type: string
                    enum: [INVALID_CREDENTIALS]
        '429':
          description: Account or IP is locked out after repeated failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: |
        **Performs no server-side invalidation.** The endpoint requires a valid
        token and returns an acknowledgement, but there is no revocation list and
        no token version on the user record — the JWT remains valid until it
        expires (7 days from issue).

        The web client does not call this at all; it discards the token from
        local storage. Treat this endpoint as advisory until server-side
        revocation is implemented.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, expired or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/verify:
    get:
      tags: [Auth]
      summary: Verify JWT and load current user from the database
      description: |
        Validates the bearer token, then returns the same `user` object shape as `POST /auth/login`
        (`id`, `username`, `email`, `fullName`, `preferences`). Use this on app load to refresh
        the client session (not only the JWT subject `id`).
      operationId: verifyToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/UserSession'
        '401':
          description: Access denied or unauthorized
        '404':
          description: User id in token no longer exists in the database
        '500':
          description: Server error

  /auth/info/{userId}:
    get:
      tags: [Auth]
      summary: Aggregated profile and stats for a user
      description: |
        **Public route — no JWT required, and ownership of `userId` is not
        verified.** Anyone who knows an id can read that user's streak, daily
        totals, coin balance and 7d/30d activity charts. Treat this as a known
        hardening gap and do not expose it further without adding an access
        check.

        Supports an optional `lang` query to override the target language, and
        respects `x-timezone-offset` for accurate local-midnight stat boundaries.
      operationId: getUserInfo
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: lang
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/TimezoneOffset'
      responses:
        '200':
          description: Profile snapshot
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid user id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/goal-tier:
    patch:
      tags: [Auth]
      summary: Update daily goal tier for a language
      operationId: patchGoalTier
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier, languageCode]
              properties:
                tier:
                  type: string
                languageCode:
                  type: string
      responses:
        '200':
          description: Updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  tier:
                    type: string
                  languageCode:
                    type: string
        '400':
          description: Missing fields
        '401':
          description: Unauthorized

  /auth/preferences:
    patch:
      tags: [Auth]
      summary: Set user target language preference
      operationId: patchPreferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetLanguage]
              properties:
                targetLanguage:
                  type: string
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  targetLanguage:
                    type: string
        '400':
          description: targetLanguage is required
        '401':
          description: Unauthorized

  /auth/languages:
    get:
      tags: [Auth]
      summary: List supported languages
      operationId: listLanguages
      responses:
        '200':
          description: Array of { code, name, isRTL }
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /auth/check-availability:
    post:
      tags: [Auth]
      summary: Check whether a username and/or email are still free
      description: |
        Advisory availability check used by the sign-up form while the user is
        still typing. `POST /auth/register` re-checks and owns the authoritative
        answer, because two people can pick the same name between this call and
        the submission.

        A field is omitted from the response when it is absent or fails format
        validation — the endpoint will not answer about a value that could not
        be registered regardless.

        **Unauthenticated, and it reveals whether an identity is registered.**
        Rate limited per IP; see the 429 response.
      operationId: checkAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: 3-20 chars, ASCII letters/digits/underscore, must contain a letter.
                  example: ada
                email:
                  type: string
                  format: email
                  example: ada@example.com
      responses:
        '200':
          description: Availability of each well-formed field supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResult'
        '429':
          description: Too many availability checks from this IP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'

  /auth/login-lockout:
    get:
      tags: [Auth]
      summary: Current login lockout state for the caller
      description: |
        Lets the login page restore its countdown after a reload during a
        lockout, instead of showing a normal form and letting the user discover
        the lockout by failing a request that was never going to be checked.

        The lockout is keyed on `(email, ip)`; the account-wide bucket also
        applies, and the stricter of the two is returned. `email` is optional —
        omit it when the form is still empty and the answer reflects the
        IP-wide bucket alone.

        **Unauthenticated.** Rate limited per IP.
      operationId: getLoginLockout
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
          description: The address being signed in to, if known.
          example: ada@example.com
      responses:
        '200':
          description: Current lockout state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockoutStatus'
        '429':
          description: Too many lockout lookups from this IP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'

  /auth/profile/insights/{userId}:
    get:
      tags: [Auth]
      summary: Markov / learning analytics for profile (vocab + phrases)
      operationId: getProfileInsights
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vocab and phrase insight payloads
          content:
            application/json:
              schema:
                type: object
                properties:
                  vocab:
                    $ref: '#/components/schemas/InsightStats'
                  phrase:
                    $ref: '#/components/schemas/InsightStats'
        '401':
          description: Unauthorized

  /auth/profile/reset/{languageCode}:
    post:
      tags: [Auth]
      summary: Reset all user data for a language (destructive)
      operationId: resetProfileLanguage
      security:
        - bearerAuth: []
      parameters:
        - name: languageCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reset complete
        '401':
          description: Unauthorized

  /library/courses:
    get:
      tags: [Library]
      summary: List courses owned by the current user
      operationId: listMyCourses
      security:
        - bearerAuth: []
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Course rows
        '401':
          description: Unauthorized
    post:
      tags: [Library]
      summary: Create a course
      description: |
        Creates a course owned by the caller. Required before a manual import —
        `POST /lessons/parse` needs a `courseId` to attach the new lesson to.
      operationId: createCourse
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                languageCode:
                  type: string
                level:
                  type: string
                imageUrl:
                  type: string
                isPublic:
                  type: boolean
      responses:
        '200':
          description: Created course
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  course:
                    type: object
                    description: The newly created course row
        '401':
          description: Unauthorized

  /library/courses/{id}:
    delete:
      tags: [Library]
      summary: Delete a course (optionally require confirm for courses with lessons)
      operationId: deleteCourse
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: confirm
          in: query
          description: Set to `true` to delete a course that still has lessons
          schema:
            type: string
            enum: ['true']
      responses:
        '200':
          description: Deleted
        '400':
          description: confirm_required with lesson count
        '404':
          description: Not found or not owner

  /library/courses/{id}/lessons:
    get:
      tags: [Library]
      summary: Lessons in a course with progress and course-level stats
      operationId: getCourseLessons
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            Object with `course` (metadata + aggregate stats) and `lessons` (array).
            Course stats fields include: `lesson_count`, `total_unique_words`, `completed_lessons`,
            `completion_pct`, `blue_remaining`, `blue_remaining_pct`, `total_lingqs`, `total_duration`.
        '400':
          description: Invalid course ID
        '404':
          description: Course not found

  /library/feed/{langCode}:
    get:
      tags: [Library]
      summary: Lesson feed (excludes courses user is enrolled in)
      operationId: getLessonFeed
      security:
        - bearerAuth: []
      parameters:
        - name: langCode
          in: path
          required: true
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Feed items with progress fields
        '400':
          description: Invalid language

  /library/my-lessons:
    get:
      tags: [Library]
      summary: Lessons from enrolled courses
      operationId: getMyLessons
      security:
        - bearerAuth: []
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
        - name: completed
          in: query
          description: Filter by `"true"` or `"false"`
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lesson list

  /library/check-completions:
    post:
      tags: [Library]
      summary: Batch completion check (currently disabled in implementation)
      operationId: checkCompletions
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lang:
                  type: string
      responses:
        '200':
          description: Count of newly completed lessons
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer

  /library/continue-studying:
    get:
      tags: [Library]
      summary: Recently read lessons (up to 4)
      operationId: continueStudying
      security:
        - bearerAuth: []
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recent lessons

  /library/guided-courses:
    get:
      tags: [Library]
      summary: Courses with enrollment and progress aggregates
      operationId: getGuidedCourses
      security:
        - bearerAuth: []
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Course stats array

  /library/lessons/{id}/bookmark:
    post:
      tags: [Library]
      summary: Toggle lesson bookmark
      operationId: toggleLessonBookmark
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'JSON body with a `bookmarked` boolean property.'

  /library/lingq-imported-ids:
    get:
      tags: [Library]
      summary: LingQ lesson IDs already imported by this user
      description: |
        Lets the import UI mark lessons that have already been brought across,
        and enforces the daily quota counter.
      operationId: lingqImportedIds
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TimezoneOffset'
        - name: lang
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Imported IDs, today's count, and the quota
          content:
            application/json:
              schema:
                type: object
                properties:
                  importedIds:
                    type: array
                    items:
                      type: integer
                  importedToday:
                    type: integer
                  maxQuota:
                    type: integer
                    example: 10
        '401':
          description: Unauthorized

  /library/lingq-courses:
    get:
      tags: [Library]
      summary: Recommended LingQ courses for the active language
      description: |
        Proxies LingQ's recommended-course list. A key may be supplied per
        request via the `x-lingq-apikey` header.
      operationId: lingqCourses
      security:
        - bearerAuth: []
      parameters:
        - name: x-lingq-apikey
          in: header
          required: false
          schema:
            type: string
          description: Caller-supplied LingQ API key.
      responses:
        '200':
          description: Course list from LingQ
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized

  /library/lingq-lessons:
    get:
      tags: [Library]
      summary: Lessons within one LingQ course
      operationId: lingqLessons
      security:
        - bearerAuth: []
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
        - name: courseId
          in: query
          required: true
          schema:
            type: string
        - name: apiKey
          in: query
          required: false
          schema:
            type: string
          description: Caller-supplied LingQ API key.
      responses:
        '200':
          description: Lesson list, either a bare array or a `{ results }` envelope.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Missing language or course ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized

  /library/lingq-import-selected:
    post:
      tags: [Library]
      summary: Import a specific batch of selected LingQ lessons
      description: |
        Imports the exact lessons the user ticked, rather than a whole language.
        At most 10 lessons per call, which is also the daily quota; the client
        calls this repeatedly and merges progress as it goes.

        Replaces an older bulk-import endpoint that streamed progress logs — this
        one returns a single JSON result.
      operationId: lingqImportSelected
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                apiKey:
                  type: string
                languageCode:
                  type: string
                selectedLessons:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    description: A lesson chosen in the UI; forwarded to the importer verbatim.
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
        '400':
          description: No lessons selected, or more than 10
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Daily import quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized

  /library/lingq-translation/{lessonId}:
    get:
      tags: [Library]
      summary: Fetch and cache a lesson translation from LingQ
      operationId: lingqTranslation
      security:
        - bearerAuth: []
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Translation for the lesson
          content:
            application/json:
              schema:
                type: object
        '404':
          description: No translation available for this lesson
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized

  /lessons/parse:
    post:
      tags: [Lessons]
      summary: Manual import — create a lesson from user-supplied text and tokenize it
      description: |
        **Entry point for manual import**, where the user writes or pastes their own
        content. Despite the name, this does two things: it inserts the lesson row
        *and* tokenizes `rawText` into LingQ tokens/phrases.

        `courseId` must reference a course the caller already owns — create one
        with `POST /library/courses` first. This is the counterpart to the LingQ
        import flow under `/library/lingq-*`; the two never overlap.
      operationId: parseLesson
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseId, title, rawText]
              properties:
                courseId:
                  type: string
                  description: Destination course; must be owned by the caller.
                title:
                  type: string
                description:
                  type: string
                imageUrl:
                  type: string
                audioUrl:
                  type: string
                audioDuration:
                  type: number
                isPublic:
                  type: boolean
                originalUrl:
                  type: string
                  description: Where the user sourced the text, kept as provenance.
                rawText:
                  type: string
                  description: The lesson body typed or pasted by the user.
                languageCode:
                  type: string
      responses:
        '200':
          description: Lesson created; includes `lessonId` and the generated tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lessonId:
                    type: string
                  tokens:
                    type: array
                    items:
                      type: object
        '401':
          description: Unauthorized

  /lessons/{id}:
    get:
      tags: [Lessons]
      summary: Reader payload (tokens, phrases, navigation, progress hints)
      operationId: getLessonReader
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reader bundle
        '404':
          description: Not found
    put:
      tags: [Lessons]
      summary: Update lesson metadata and optionally re-parse text
      operationId: updateLesson
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                imageUrl:
                  type: string
                audioUrl:
                  type: string
                audioDuration:
                  type: number
                isPublic:
                  type: boolean
                rawText:
                  type: string
                courseId:
                  type: string
                languageCode:
                  type: string
      responses:
        '200':
          description: Success
        '403':
          description: Not owner
        '404':
          description: Not found
    delete:
      tags: [Lessons]
      summary: Delete lesson (owner only)
      operationId: deleteLesson
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '403':
          description: Access denied

  /lessons/{id}/edit:
    get:
      tags: [Lessons]
      summary: Lesson row for edit form (owner only)
      operationId: getLessonForEdit
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lesson
        '403':
          description: Forbidden
        '404':
          description: Not found

  /lessons/{id}/progress:
    put:
      tags: [Lessons]
      summary: Sync lesson progress and daily stats / streak
      description: Updates listening time and words read. Respects `x-timezone-offset` header for accurate local-midnight daily stat boundaries.
      operationId: putLessonProgress
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/TimezoneOffset'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                newWordsCount:
                  type: integer
                lingqsCount:
                  type: integer
                knownWordsCount:
                  type: integer
                highestPageRead:
                  type: integer
                isCompleted:
                  type: boolean
                listeningSec:
                  type: integer
                wordsRead:
                  type: integer
                incrementReadTime:
                  type: boolean
      responses:
        '200':
          description: Progress synced successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /lessons/{id}/reset:
    post:
      tags: [Lessons]
      summary: Reset lesson progress (highest page read back to 0)
      description: Used for sequential navigation — allows a user to restart a lesson from the beginning.
      operationId: resetLessonProgress
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Progress reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Invalid lesson id
  /vocab/list:
    get:
      tags: [Vocabulary]
      summary: Paginated vocabulary for a language
      operationId: listVocab
      security:
        - bearerAuth: []
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: string
            default: '1'
        - name: limit
          in: query
          schema:
            type: string
            default: '25'
        - name: search
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          description: desc, asc, stage_asc, last_reviewed_desc, etc.
          schema:
            type: string
      responses:
        '200':
          description: Paginated payload with data and total count.

  /vocab/upsert:
    post:
      tags: [Vocabulary]
      summary: Create or update a word (stage, meaning, tags, coins)
      description: Respects `x-timezone-offset` header for accurate local-midnight daily stat boundaries.
      operationId: upsertVocab
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TimezoneOffset'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                wordText:
                  type: string
                stage:
                  type: integer
                meaning:
                  type: string
                languageCode:
                  type: string
                isIgnoredInitially:
                  type: boolean
                wordTags:
                  type: array
                  items:
                    type: string
                related_phrase_occur:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: Includes success and coinDelta fields.

  /vocab/batch-upsert:
    post:
      tags: [Vocabulary]
      summary: Batch set stage for many words
      operationId: batchUpsertVocab
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                words:
                  type: array
                  items:
                    oneOf:
                      - type: string
                      - type: object
                stage:
                  type: integer
                languageCode:
                  type: string
                coinDeltaTotal:
                  type: integer
                knownDeltaTotal:
                  type: integer
      responses:
        '200':
          description: Success

  /vocab/recalculate-stats:
    post:
      tags: [Vocabulary]
      summary: Recompute coins, known words, and LingQ counts from DB truth
      operationId: recalculateVocabStats
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                languageCode:
                  type: string
      responses:
        '200':
          description: Stats recalculated and updated in the database
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  trueCoins:
                    type: integer
                  trueKnown:
                    type: integer
                  trueLingqs:
                    type: integer

  /vocab/hints:
    get:
      tags: [Vocabulary]
      summary: Dictionary hints (cached; uses server LingQ token if configured)
      operationId: getVocabHints
      security:
        - bearerAuth: []
      parameters:
        - name: word
          in: query
          required: true
          schema:
            type: string
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Hints array
        '400':
          description: Missing params
        '500':
          description: Missing LingQ token or fetch error

  /vocab/tags:
    get:
      tags: [Vocabulary]
      summary: Distinct tags for autocomplete (words + phrases)
      operationId: listVocabTags
      security:
        - bearerAuth: []
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Array of tag strings

  /vocab/insights:
    get:
      tags: [Vocabulary]
      summary: Markov matrix and discovery velocity for vocabulary
      operationId: getVocabInsights
      security:
        - bearerAuth: []
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            Markov matrix, stationary distribution, and velocity metrics.
            Includes `healthScore` (0–100, long-term retention estimate) and
            `burnoutIndex` (0–100, proportion of ignored words in long-term equilibrium).
            Returns `{ message, discoveryVelocity }` if not enough data for Markov analysis yet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  matrix:
                    type: object
                  stationary:
                    type: object
                  discoveryVelocity:
                    type: number
                  healthScore:
                    type: number
                    description: Normalized 0-100 score of long-term retention
                  burnoutIndex:
                    type: number
                    description: Proportion of Ignored words in long-term equilibrium
                  message:
                    type: string
                    description: Present only when there is insufficient data for Markov analysis
        '400':
          description: Missing lang parameter

  /vocab:
    delete:
      tags: [Vocabulary]
      summary: Batch delete vocabulary relations by id
      operationId: batchDeleteVocab
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Success
        '400':
          description: Invalid body

  /phrases/list:
    get:
      tags: [Phrases]
      summary: Paginated phrase list
      operationId: listPhrases
      security:
        - bearerAuth: []
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated payload with data and total count.

  /phrases:
    post:
      tags: [Phrases]
      summary: Create a phrase LingQ
      description: Respects `x-timezone-offset` header for accurate local-midnight daily stat boundaries.
      operationId: createPhrase
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TimezoneOffset'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phrase_text, language_code]
              properties:
                phrase_text:
                  type: string
                user_meaning:
                  type: string
                language_code:
                  type: string
                related_phrase_occur:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: Created phrase
        '400':
          description: Missing fields
    delete:
      tags: [Phrases]
      summary: Batch delete phrases by id
      operationId: batchDeletePhrases
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Success

  /phrases/{id}:
    put:
      tags: [Phrases]
      summary: Update phrase stage, meaning, tags
      description: Respects `x-timezone-offset` header for accurate local-midnight daily stat boundaries.
      operationId: updatePhrase
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/TimezoneOffset'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stage:
                  type: integer
                user_meaning:
                  type: string
                wordTags:
                  type: array
                  items:
                    type: string
                related_phrase_occur:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: Success
        '404':
          description: Not found

  /upload/image:
    post:
      tags: [Upload]
      summary: Upload an image (multipart field name `file`)
      operationId: uploadImage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: |
            Returns `{ url }` where `url` is an absolute Cloudinary CDN URL
            (e.g. `https://res.cloudinary.com/your-cloud/image/upload/v.../lexiflow/images/xyz.jpg`).
        '400':
          description: Validation error
        '500':
          description: Cloudinary upload failed

  /upload/audio:
    post:
      tags: [Upload]
      summary: Upload audio (multipart field name `file`)
      operationId: uploadAudio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: |
            Returns `{ url }` where `url` is an absolute Cloudinary CDN URL
            (e.g. `https://res.cloudinary.com/your-cloud/video/upload/v.../lexiflow/audio/xyz.mp3`).
        '400':
          description: Validation error
        '500':
          description: Cloudinary upload failed
